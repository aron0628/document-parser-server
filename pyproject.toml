[project]
name = "document-parser-server"
version = "0.1.0"
description = "Document Parser API Server"
readme = "README.md"
authors = [
    {name = "teddylee777", email = "teddylee777@gmail.com"},
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0,<0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "pypdf2>=3.0.0",
    "Pillow>=10.0.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.3.0",
    "langchain-text-splitters>=0.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.0",
    "kiwipiepy>=0.18.0",
    "langchain>=0.3.0,<1.0.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langchain-xai>=0.2.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
